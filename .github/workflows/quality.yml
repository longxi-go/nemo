name: Quality

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  check:
    name: ${{ matrix.checks }} (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: '1.27.0'
            checks: compatibility
          - go-version: '1.27.4'
            checks: quality
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Prepare pinned formatter
        if: matrix.checks == 'quality'
        run: make setup
      - name: Prepare pinned linter
        if: matrix.checks == 'quality'
        env:
          GOBIN: ${{ runner.temp }}/quality-tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
          printf '%s\n' "$GOBIN" >> "$GITHUB_PATH"
      - name: Run complete quality gates
        if: matrix.checks == 'quality'
        run: make check
      - name: Verify minimum Go compatibility
        if: matrix.checks == 'compatibility'
        run: |
          make compatibility

  portability:
    name: Runtime tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify native sources, admission and refresh
        run: >-
          go test -count=1
          ./pkg/source ./pkg/codec ./pkg/maptypes ./pkg/environment
          ./pkg/binding ./pkg/limits ./internal/admission ./internal/resolution

  documentation:
    name: Build bilingual documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: docs/design/uv.lock
      - run: make docs-build
