name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish or verify (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate stable tag and publication prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate release contract and GitHub Pages settings
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release.py --root release-source --tag "$RELEASE_TAG" \
            --check-github --repository "$GITHUB_REPOSITORY"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C release-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    name: Verify exact tagged source
    needs: validate
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ needs.validate.outputs.commit }}

  publish:
    name: Publish GitHub Release
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Publish maintained English release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/publish_release.py --root release-source \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  deploy-site:
    name: Deploy released documentation
    needs: [validate, publish]
    if: needs.publish.outputs.latest == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-pages.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
